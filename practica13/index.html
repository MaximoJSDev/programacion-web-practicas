<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Practica 13</title>
    <style>
      h1 {
        font-size: 48px;
      }
      h2 {
        font-size: 42px;
      }
      h3 {
        font-size: 36px;
      }
      h4 {
        font-size: 30px;
      }
      h5 {
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <script>
      function suma(a, b) {
        let resultado = a + b;
        document.write(resultado);
      }
      function texto(cadena, color, size) {
        document.write(
          `<font size=${size} color=${color}><b>${cadena}</b></font>`,
        );
      }

      function texto2(cadena, tam, color, tipografia) {
        document.write(
          `<h${tam} style="color: ${color}; font-family: ${tipografia};">${cadena}</h${tam}>`,
        );
      }

      function salto() {
        document.write(`<br>`);
      }

      suma(20, 10);
      salto();
      texto("Saludos a todos", "green", "7");
      salto();
      texto2("H1 Saludos a todos", "1", "navy", "arial");
      texto2("H2 Saludos a todos", "2", "red", "consolas");
      texto2("H3 Saludos a todos", "3", "orange", "arial");
      texto2("H4 Saludos a todos", "4", "navy", "sans-serif");
      texto2("H5 Saludos a todos", "5", "yellow", "arial");
    </script>
  </body>
</html>
