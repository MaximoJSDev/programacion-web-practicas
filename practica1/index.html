<!-- Define que el tipo de documento es HTML5 -->
<!doctype html>
<!-- Etiqueta principal que envuelve todo el codigo y define el idioma en ingles -->
<html lang="en">
  <head>
    <!-- Permite el uso de caracteres especiales, como acentos y la letra ñ -->
    <meta charset="UTF-8" />
    <!-- Hace que la pagina web sea responsiva y se adapte a dispositivos moviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titulo que se mostrara en la pestaña del navegador web -->
    <title>Practica 1</title>
  </head>
  <body>
    <!-- Inicio del contenido visible de la pagina web -->

    <!-- Titulo principal (h1) con alineacion centrada -->
    <h1 align="center">Tecnologico Campus Acapulco</h1>

    <!-- Subtitulo (h2) alineado a la derecha, con la etiqueta <i> para poner el texto en cursiva -->
    <h2 align="right"><i>Ingenieria en Sistemas Computacionales</i></h2>

    <!-- Titulo de tercer nivel (h3) con la etiqueta <b> para poner el texto en negrita -->
    <h3><b>Eduardo Maximiliano Cedomio Marin</b></h3>

    <!-- Etiqueta <font> para cambiar el tipo de fuente a "arial", el tamaño a "5" y el color a azul -->
    <font face="arial" size="5" color="blue">23320787</font>
  </body>
</html>
