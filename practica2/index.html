<!-- Define que el documento es de tipo HTML5 -->
<!doctype html>
<!-- Etiqueta principal que establece el idioma en ingles -->
<html lang="en">
  <head>
    <!-- Permite el uso de caracteres especiales como acentos -->
    <meta charset="UTF-8" />
    <!-- Hace que la pagina web se adapte a diferentes tamaños de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titulo que aparece en la pestaña del navegador -->
    <title>Practica 2</title>
  </head>
  <!-- Cuerpo de la pagina con un color de fondo rosa -->
  <body bgcolor="pink">
    <!-- Imagen del logo con una altura de 100 pixeles -->
    <img height="100" src="./logos/tecnm/logo-tecnm.png" alt="logo de tec" />
    <!-- Otra imagen alineada a la derecha, tambien con altura de 100 pixeles -->
    <img
      align="right"
      height="100"
      src="./logos/tecnm/4.jpg"
      alt="logo de tec"
    />
    <!-- Salto de linea (como presionar Enter) -->
    <br />
    <!-- Enlace de texto que abre la pagina del Tecnm en una nueva pestaña -->
    <a target="_blank" href="http://acapulco.tecnm.mx">Conectar a Tecnm</a>
    <!-- Otro salto de linea -->
    <br />
    <!-- Enlace que usa una imagen como boton; tambien abre en una nueva pestaña -->
    <a target="_blank" href="http://acapulco.tecnm.mx"
      ><img src="./logos/tecnm/logo-tecnm.png" alt=""
    /></a>
    <!-- Centra todo el contenido que esta dentro de esta etiqueta -->
    <center>
      <!-- Tabla con un borde visible de tamaño 1 -->
      <table border="1">
        <!-- Fila de los encabezados de la tabla con color de fondo azul verdoso -->
        <tr bgcolor="#4f85a0">
          <th width="300">Nombre</th>
          <th width="200">No.Control</th>
          <th width="200">Carrera</th>
          <th width="50">Semestre</th>
        </tr>
        <!-- Filas con los datos de cada estudiante -->
        <tr>
          <td>Cesar Chavez</td>
          <td>23320788</td>
          <td>ICS</td>
          <td>7</td>
        </tr>
        <tr>
          <td>Lupita</td>
          <td>23320781</td>
          <td>ICS</td>
          <td>4</td>
        </tr>
        <tr>
          <td>Angel</td>
          <td>23320789</td>
          <td>ICS</td>
          <td>7</td>
        </tr>
      </table>
    </center>
    <!-- Tres saltos de linea para dejar un espacio mas grande -->
    <br /><br /><br />

    <!-- Centra una segunda tabla -->
    <center>
      <!-- Tabla sin borde especificado -->
      <table>
        <!-- Fila que contiene imagenes, donde cada celda tiene un fondo blanco -->
        <tr>
          <td bgcolor="#fff">
            <img width="200px" src="./logos/sb/1.png" alt="" />
          </td>
          <td bgcolor="#fff">
            <img width="200px" src="./logos/sb/2.png" alt="" />
          </td>
          <td bgcolor="#fff">
            <img width="200px" src="./logos/sb/3.jpg" alt="" />
          </td>
        </tr>
        <!-- Fila con el texto que va debajo de cada imagen -->
        <tr>
          <td>Enlace 1</td>
          <td>Enlace 2</td>
          <td>Enlace 3</td>
        </tr>
      </table>
    </center>
  </body>
</html>
